# Royal Yellow Analyzer: PostgreSQL + FastAPI backend + nginx-served React app.
#   cp .env.example .env   (set POSTGRES_PASSWORD)
#   docker compose up --build
# then open http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-royal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-royal_yellow}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-royal}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-royal_yellow}"
      COLLECTOR_MIN_INTERVAL_SECONDS: "${COLLECTOR_MIN_INTERVAL_SECONDS:-5}"
      COLLECTOR_USER_AGENT: "${COLLECTOR_USER_AGENT:-RoyalYellowAnalyzer/0.1 (+https://codencode.my; historical-analysis research tool)}"
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      SEED_ON_START: ${SEED_ON_START:-true}
    volumes:
      - ./seed:/seed:ro
      - collector_cache:/data/collector_cache
    # Not published to the network; the frontend proxies /api. Bound to loopback for /docs.
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  pgdata:
  collector_cache:
